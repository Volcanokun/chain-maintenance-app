<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chain Stats — バイクチェーン計算</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-gray-800 text-white px-6 py-4">
    <h1 class="text-xl font-bold">🔗 Chain Stats</h1>
    <p class="text-gray-400 text-sm mt-0.5">メーカー・排気量・車種を選んでチェーンの回転数を確認</p>
  </header>

  <main class="max-w-2xl mx-auto p-6 space-y-6" x-data="chainApp()">

    <!-- Step 1: メーカー選択 -->
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Step 1 — メーカー</h2>
      <select x-model="selectedMake" @change="onMakeChange"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        <option value="">— メーカーを選んでください —</option>
        <template x-for="make in makes" :key="make">
          <option :value="make" x-text="make"></option>
        </template>
      </select>
    </section>

    <!-- Step 2: 排気量選択 -->
    <section class="bg-white rounded-xl shadow p-6" x-show="selectedMake">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Step 2 — 排気量</h2>
      <div class="flex flex-wrap gap-2">
        <template x-for="cc in displacements" :key="cc">
          <button
            @click="onDisplacementChange(cc)"
            :class="selectedCc === cc
              ? 'bg-gray-800 text-white'
              : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
            class="px-3 py-1.5 rounded-lg text-sm font-medium transition">
            <span x-text="`${cc} cc`"></span>
          </button>
        </template>
      </div>
    </section>

    <!-- Step 3: 車種選択 -->
    <section class="bg-white rounded-xl shadow p-6" x-show="selectedCc">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Step 3 — 車種</h2>
      <select x-model="selectedBikeId" @change="onBikeChange"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        <option value="">— 車種を選んでください —</option>
        <template x-for="bike in bikes" :key="bike.id">
          <option :value="bike.id" x-text="bike.model_name"></option>
        </template>
      </select>
    </section>

    <!-- 計算結果 -->
    <section class="bg-white rounded-xl shadow p-6 space-y-4" x-show="stats">

      <!-- 車種サマリー -->
      <div>
        <p class="text-lg font-bold text-gray-800" x-text="stats && stats.bike.model_name"></p>
        <p class="text-xs text-gray-400 mt-0.5"
          x-text="stats && `F${stats.bike.front_sprocket}T / R${stats.bike.rear_sprocket}T / ${stats.bike.chain_links}コマ / チェーン${stats.bike.chain_pitch || '-'} / リアタイヤ ${stats.bike.rear_tire_size}`">
        </p>
      </div>

      <hr class="border-gray-100">

      <!-- メイン指標 -->
      <div class="bg-gray-50 rounded-xl p-5 text-center">
        <p class="text-sm text-gray-500 mb-1">チェーン1周あたりのタイヤ回転数</p>
        <p class="text-5xl font-bold text-gray-800" x-text="stats && stats.wheel_rotations_per_chain_loop">
        </p>
        <p class="text-sm text-gray-400 mt-1">回転</p>
      </div>

      <!-- サブ指標 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-gray-50 rounded-xl p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">チェーン1周の走行距離</p>
          <p class="text-2xl font-bold text-gray-700" x-text="stats && `${stats.chain_distance_per_loop_m} m`"></p>
        </div>
        <div class="bg-gray-50 rounded-xl p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">タイヤ円周（計算値）</p>
          <p class="text-2xl font-bold text-gray-700" x-text="stats && `${stats.tire_circumference_mm} mm`"></p>
        </div>
      </div>

      <!-- 計算式の説明 -->
      <details class="text-xs text-gray-400 cursor-pointer">
        <summary class="hover:text-gray-600">計算式を見る</summary>
        <div class="mt-2 space-y-1 pl-2">
          <p>タイヤ回転数 = チェーンコマ数 ÷ リアスプロケ丁数</p>
          <p x-text="stats && `= ${stats.bike.chain_links} ÷ ${stats.bike.rear_sprocket} = ${stats.wheel_rotations_per_chain_loop}`"></p>
          <p class="mt-1">タイヤ円周 = π × (リム径mm + サイドウォール高さ × 2)</p>
          <p>走行距離 = タイヤ回転数 × タイヤ円周</p>
        </div>
      </details>

    </section>

  </main>

  <script>
    function chainApp() {
      return {
        makes: [],
        displacements: [],
        bikes: [],
        stats: null,
        selectedMake: '',
        selectedCc: null,
        selectedBikeId: '',

        async init() {
          const res = await fetch('/makes');
          this.makes = await res.json();
        },

        async onMakeChange() {
          this.displacements = [];
          this.bikes = [];
          this.stats = null;
          this.selectedCc = null;
          this.selectedBikeId = '';
          if (!this.selectedMake) return;
          const res = await fetch(`/displacements?make=${encodeURIComponent(this.selectedMake)}`);
          this.displacements = await res.json();
        },

        async onDisplacementChange(cc) {
          this.selectedCc = cc;
          this.bikes = [];
          this.stats = null;
          this.selectedBikeId = '';
          const res = await fetch(
            `/bikes?make=${encodeURIComponent(this.selectedMake)}&displacement_cc=${cc}`
          );
          this.bikes = await res.json();
        },

        async onBikeChange() {
          this.stats = null;
          if (!this.selectedBikeId) return;
          const res = await fetch(`/bikes/${this.selectedBikeId}/stats`);
          if (res.ok) this.stats = await res.json();
        },
      };
    }
  </script>

</body>
</html>
