<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンテ記録 — Chain Maintenance App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-gray-800 text-white px-6 py-4 flex items-center gap-6">
    <h1 class="text-xl font-bold">🔗 Chain Maintenance App</h1>
    <nav class="flex gap-4 text-sm">
      <a href="/" class="text-gray-300 hover:text-white">バイク管理</a>
      <span class="text-white font-semibold border-b-2 border-white pb-0.5">メンテ記録</span>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto p-6 space-y-8" x-data="recordsApp()">

    <!-- バイク選択 -->
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-bold mb-4 text-gray-700">バイクを選択</h2>
      <select x-model="selectedId" @change="onSelectChange"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        <option value="">— バイクを選んでください —</option>
        <template x-for="m in motorcycles" :key="m.id">
          <option :value="m.id" x-text="m.name"></option>
        </template>
      </select>
    </section>

    <!-- メンテ記録追加フォーム -->
    <section x-show="selectedId" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-bold mb-4 text-gray-700">記録を追加</h2>
      <form @submit.prevent="addRecord" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">実施日 <span class="text-red-500">*</span></label>
          <input x-model="form.performed_at" type="date"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">走行距離（km）<span class="text-red-500">*</span></label>
          <input x-model.number="form.odometer_km" type="number" min="0" placeholder="例: 15000"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">潤滑剤</label>
          <input x-model="form.lubricant" type="text" placeholder="例: WAKO'S CHL"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">メモ</label>
          <input x-model="form.notes" type="text" placeholder="例: チェーン清掃+注油"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
        </div>
        <div class="sm:col-span-2 flex items-center gap-3">
          <button type="submit"
            class="bg-gray-800 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition disabled:opacity-50"
            :disabled="saving">
            <span x-show="!saving">追加する</span>
            <span x-show="saving">追加中…</span>
          </button>
          <span x-show="formError" x-text="formError" class="text-red-500 text-sm"></span>
        </div>
      </form>
    </section>

    <!-- メンテ記録一覧 -->
    <section x-show="selectedId">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold text-gray-700">メンテ記録一覧</h2>
        <button @click="loadRecords" class="text-sm text-gray-500 hover:text-gray-700">↻ 更新</button>
      </div>

      <div x-show="loadingRecords" class="text-center text-gray-400 py-10">読み込み中…</div>

      <div x-show="!loadingRecords && records.length === 0" class="text-center text-gray-400 py-10 bg-white rounded-xl shadow">
        メンテ記録がありません
      </div>

      <div class="space-y-3">
        <template x-for="r in records" :key="r.id">
          <div class="bg-white rounded-xl shadow px-5 py-4 flex items-start justify-between gap-4">
            <div class="space-y-0.5">
              <p class="font-semibold text-gray-800" x-text="r.performed_at"></p>
              <p class="text-sm text-gray-600">
                走行距離: <span class="font-medium" x-text="`${r.odometer_km.toLocaleString()} km`"></span>
              </p>
              <p class="text-sm text-gray-500" x-show="r.lubricant" x-text="`潤滑剤: ${r.lubricant}`"></p>
              <p class="text-sm text-gray-500" x-show="r.notes" x-text="r.notes"></p>
            </div>
            <button @click="removeRecord(r.id)"
              class="text-gray-300 hover:text-red-400 text-lg leading-none transition shrink-0"
              title="削除">✕</button>
          </div>
        </template>
      </div>
    </section>

  </main>

  <script>
    function recordsApp() {
      return {
        motorcycles: [],
        selectedId: '',
        records: [],
        loadingRecords: false,
        saving: false,
        formError: '',
        form: { performed_at: new Date().toISOString().slice(0, 10), odometer_km: null, lubricant: '', notes: '' },

        async init() {
          const res = await fetch('/motorcycles');
          this.motorcycles = await res.json();

          // URLクエリパラメータ ?id=N でバイクを事前選択
          const params = new URLSearchParams(location.search);
          const id = params.get('id');
          if (id) {
            this.selectedId = id;
            await this.loadRecords();
          }
        },

        async onSelectChange() {
          this.records = [];
          if (this.selectedId) await this.loadRecords();
        },

        async loadRecords() {
          if (!this.selectedId) return;
          this.loadingRecords = true;
          try {
            const res = await fetch(`/maintenance-records/by-motorcycle/${this.selectedId}`);
            this.records = await res.json();
          } finally {
            this.loadingRecords = false;
          }
        },

        async addRecord() {
          this.formError = '';
          const { performed_at, odometer_km } = this.form;
          if (!performed_at || odometer_km === null || odometer_km === '') {
            this.formError = '実施日と走行距離は必須です';
            return;
          }
          this.saving = true;
          try {
            const body = {
              motorcycle_id: Number(this.selectedId),
              performed_at,
              odometer_km,
              lubricant: this.form.lubricant || null,
              notes: this.form.notes || null,
            };
            const res = await fetch('/maintenance-records', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) { this.formError = '追加に失敗しました'; return; }
            this.form = { performed_at: new Date().toISOString().slice(0, 10), odometer_km: null, lubricant: '', notes: '' };
            await this.loadRecords();
          } catch {
            this.formError = '通信エラーが発生しました';
          } finally {
            this.saving = false;
          }
        },

        async removeRecord(id) {
          if (!confirm('この記録を削除しますか？')) return;
          await fetch(`/maintenance-records/${id}`, { method: 'DELETE' });
          await this.loadRecords();
        },
      };
    }
  </script>

</body>
</html>
