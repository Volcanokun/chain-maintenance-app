name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: chain-maintenance-app
  ECS_CLUSTER: chain-maintenance-prod-cluster
  ECS_SERVICE: chain-maintenance-prod-service
  TASK_FAMILY: chain-maintenance-prod-app
  CONTAINER_NAME: app
  CODEDEPLOY_APP: chain-maintenance-prod-deploy-app
  CODEDEPLOY_GROUP: chain-maintenance-prod-deploy-group

# 同時デプロイを防止（新しい run はキューイング）
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write  # OIDC トークン取得に必要
  contents: read   # リポジトリ checkout に必要

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Lint & Test
  # ────────────────────────────────────────────────────────────
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest tests/ -v

  # ────────────────────────────────────────────────────────────
  # 2. Docker Build → ECR Push → 新タスク定義を登録
  # ECR は IMMUTABLE タグのため sha タグのみ使用。
  # 既存タスク定義の JSON を取得してイメージだけ差し替え、新リビジョンを登録する。
  # ────────────────────────────────────────────────────────────
  build:
    name: Build, Push & Register Task Definition
    needs: lint-test
    runs-on: ubuntu-latest

    outputs:
      task-def-arn: ${{ steps.register.outputs.task-def-arn }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror xray-daemon to private ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # public.ecr.aws はプライベートサブネットから到達不可のため、事前にミラーリング
          # GitHub Actions ランナーはインターネットアクセスがあるので pull 可能
          docker pull --platform linux/amd64 public.ecr.aws/xray/aws-xray-daemon:latest
          docker tag public.ecr.aws/xray/aws-xray-daemon:latest \
            $REGISTRY/chain-maintenance-xray-daemon:latest
          docker push $REGISTRY/chain-maintenance-xray-daemon:latest

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --push \
            .

      - name: Register new task definition with updated image
        id: register
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          NEW_IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # 現在のタスク定義を取得し、イメージだけ差し替えて一時ファイルに保存
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json \
          | jq --arg IMAGE "$NEW_IMAGE" '
              .containerDefinitions[0].image = $IMAGE
              | del(
                  .taskDefinitionArn, .revision, .status,
                  .requiresAttributes, .placementConstraints,
                  .compatibilities, .registeredAt, .registeredBy
                )
            ' > /tmp/new-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered: $NEW_TASK_DEF_ARN"
          echo "task-def-arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────
  # 3. Alembic Migration
  # 新タスク定義（新イメージ）を使って migration 専用タスクを起動。
  # 完了後に終了コードを確認し、失敗なら pipeline を止める。
  # Deploy より先に実行し「新コードが古いスキーマを叩く」を防ぐ。
  # ────────────────────────────────────────────────────────────
  migrate:
    name: Alembic Migration
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Alembic migration via ECS Run Task
        run: |
          TASK_DEF_ARN="${{ needs.build.outputs.task-def-arn }}"

          # ECS サービスのネットワーク設定を再利用（サブネット/SG を secrets に持たせない）
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)

          echo "Task definition : $TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{"containerOverrides":[{"name":"app","command":["python","-m","alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task ARN: $TASK_ARN"

          # タスク停止まで待機（デフォルト最大 10 分）
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          # 終了コードを確認してパイプラインを止める
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed (exit code: $EXIT_CODE)"
            exit 1
          fi

          echo "Migration completed successfully"

  # ────────────────────────────────────────────────────────────
  # 4. CodeDeploy Blue/Green デプロイ
  # AppSpec JSON を動的生成 → CodeDeploy にデプロイ作成を依頼。
  # CodeDeploy が Green タスクを起動 → テストリスナー(8080)で確認 →
  # 本番リスナー(443)を Blue→Green に切替 → 5分後に Blue タスクを終了。
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Blue/Green Deploy via CodeDeploy
    needs: [build, migrate]
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create CodeDeploy deployment
        id: create-deployment
        run: |
          TASK_DEF_ARN="${{ needs.build.outputs.task-def-arn }}"

          # AppSpec JSON を構築（ECS Blue/Green 用フォーマット）
          APPSPEC=$(jq -cn \
            --arg task_def "$TASK_DEF_ARN" \
            '{
              version: 0.0,
              Resources: [{
                TargetService: {
                  Type: "AWS::ECS::Service",
                  Properties: {
                    TaskDefinition: $task_def,
                    LoadBalancerInfo: {
                      ContainerName: "app",
                      ContainerPort: 8000
                    }
                  }
                }
              }]
            }')

          APPSPEC_SHA=$(printf '%s' "$APPSPEC" | sha256sum | awk '{print $1}')

          # create-deployment 入力 JSON を構築（jq で特殊文字を安全にエスケープ）
          jq -n \
            --arg app     "$CODEDEPLOY_APP" \
            --arg grp     "$CODEDEPLOY_GROUP" \
            --arg desc    "Deploy $GITHUB_SHA" \
            --arg content "$APPSPEC" \
            --arg sha     "$APPSPEC_SHA" \
            '{
              applicationName:     $app,
              deploymentGroupName: $grp,
              description:         $desc,
              revision: {
                revisionType: "AppSpecContent",
                appSpecContent: {
                  content: $content,
                  sha256:  $sha
                }
              }
            }' > /tmp/deploy-input.json

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --cli-input-json file:///tmp/deploy-input.json \
            --query 'deploymentId' --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "deployment-id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to succeed
        run: |
          DEPLOYMENT_ID="${{ steps.create-deployment.outputs.deployment-id }}"
          echo "Waiting for deployment: $DEPLOYMENT_ID"
          # aws deploy wait は最大 30 分（15s × 120 回）ポーリング
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          echo "Blue/Green deployment completed successfully!"
